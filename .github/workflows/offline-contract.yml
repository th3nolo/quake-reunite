name: Offline contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: Synthetic pipeline, exports and API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.11.19'
          enable-cache: false
      - name: Install verified test lock
        run: |
          uv venv --python 3.13.7
          uv pip sync --require-hashes --only-binary :all: --default-index https://pypi.org/simple requirements-test.lock
          uv pip check
      - name: Check source syntax and whitespace
        run: |
          uv run --no-project --no-sync python -m compileall -q api ingest maintainer pipeline tests
          git show --format= --check HEAD
      - name: Run synthetic tests without external network access
        run: |
          uv run --no-project --no-sync python - <<'PY'
          import socket
          import unittest
          from unittest.mock import patch

          def deny_network(*args, **kwargs):
              raise AssertionError("External network access is forbidden in synthetic tests")

          with patch.object(socket.socket, "connect", deny_network), \
               patch.object(socket.socket, "connect_ex", deny_network):
              suite = unittest.defaultTestLoader.discover("tests")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
              raise SystemExit(1)
          PY
